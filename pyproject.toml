[project]
name = "research-scientist"
version = "0.1.0"
description = "AI Research Scientist - research workspace có bằng chứng (evidence-grounded)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # API & config
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    # Persistence
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "minio>=7.2",
    "qdrant-client>=1.13",
    # Jobs
    "redis>=5.2",
    "arq>=0.26",
    # LLM & orchestration
    "anthropic>=1.0",
    "google-genai>=1.0",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    # Ingestion & HTTP
    "httpx>=0.28",
    "tenacity>=9.0",
    "lxml>=5.3",
    "pymupdf>=1.25",
    "rapidfuzz>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_scientist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
